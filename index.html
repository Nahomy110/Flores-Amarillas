<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Flores Amarillas 🌻✨</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="modal" id="cardModal">
    <div class="modal-content">
      <span class="close-btn" id="closeBtn">&times;</span>
      <div class="card-header">
        <h2>Mis Lindas</h2>
      </div>
      <div class="card-body">
        <p>Estas flores amarillas son como tú: brillantes, radiantes y llenas de alegría.</p>
        <p>Gracias por iluminar cada uno de mis días. Eres simplemente hermosa.</p>
        <p class="signature">Las quiero muchito ✨</p>
      </div>
      <button class="btn-para-ti" id="openCardBtn">Para Ti 💛</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
