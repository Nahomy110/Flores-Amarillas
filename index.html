<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas ✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="night"></div>

  <!-- Contenedor de la flor -->
  <div class="flower-container" id="flowerContainer">
    <div class="flower">
      <div class="center" id="flowerCenter"></div>
      <!-- Pétalos -->
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
    </div>
    <div class="stem"></div>
    <div class="leaf leaf-left"></div>
    <div class="leaf leaf-right"></div>
  </div>

  <!-- Cartel / Mensaje interactivo -->
  <div class="card">
    <h1 id="title">Haz clic en la flor 🌻</h1>
    <p id="message">¡Tienes un detalle especial esperándote!</p>
  </div>

  <!-- Contenedor para lluvia de pétalos/estrellas -->
  <div id="particles"></div>

  <script src="script.js"></script>
</body>
</html>
